name: PDFium Build
description: Build PDFium for iOS or Android with submodule checkout and caching

inputs:
  platform:
    description: Target platform (ios or android)
    required: true
  pdfium_ref:
    description: pdfium branch, tag, or SHA; empty uses submodule commit pinned in pdfium-lib
    required: false
    default: ''
  github_token:
    description: Token for recursive submodule checkout
    required: true

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ inputs.github_token }}

    - name: Rewrite submodule URL for HTTPS
      shell: bash
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"

    - name: Checkout pdfium ref
      id: pdfium
      shell: bash
      env:
        PDFIUM_REF: ${{ inputs.pdfium_ref }}
      run: |
        set -euo pipefail
        cd pdfium
        if [ -n "$PDFIUM_REF" ]; then
          git fetch origin --tags
          git checkout --force "$PDFIUM_REF"
        fi
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        if [ -n "$PDFIUM_REF" ]; then
          echo "ref_overridden=true" >> "$GITHUB_OUTPUT"
        else
          echo "ref_overridden=false" >> "$GITHUB_OUTPUT"
        fi
        echo "PDFium source at $(git rev-parse HEAD) ($(git log -1 --oneline))"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Upgrade pip
      shell: bash
      run: python3 -m pip install --upgrade pip setuptools wheel

    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: "3.24.0"

    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@master
      with:
        version: "1.12.1"

    - name: Set up Xcode
      if: inputs.platform == 'ios'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Install NDK
      if: inputs.platform == 'android'
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        add-to-path: true

    - name: Verify toolchain
      shell: bash
      run: |
        set -euo pipefail
        python3 --version
        cmake --version
        ninja --version
        if [ "${{ inputs.platform }}" = "android" ]; then
          ndk-build -version
        fi

    - name: Install Python requirements
      shell: bash
      run: python3 -m pip install -r requirements.txt --user

    - name: Restore depot-tools cache
      id: depot-tools-cache
      uses: actions/cache@v4
      with:
        path: build/depot-tools
        key: depot-tools-${{ runner.os }}-v1
        restore-keys: |
          depot-tools-${{ runner.os }}-

    - name: Restore pdfium DEPS cache
      id: pdfium-deps-cache
      uses: actions/cache@v4
      with:
        path: |
          build/shared
          pdfium/third_party
          pdfium/buildtools
          pdfium/build
        key: pdfium-deps-${{ inputs.platform }}-${{ hashFiles('pdfium/DEPS', 'modules/pdfium.py', 'modules/pdfium_paths.py') }}-${{ steps.pdfium.outputs.sha }}
        restore-keys: |
          pdfium-deps-${{ inputs.platform }}-${{ hashFiles('pdfium/DEPS', 'modules/pdfium.py', 'modules/pdfium_paths.py') }}-

    - name: Build depot-tools
      shell: bash
      run: python3 make.py build-depot-tools

    - name: Add depot-tools to PATH
      shell: bash
      run: echo "$PWD/build/depot-tools" >> "$GITHUB_PATH"

    - name: Sync PDFium DEPS
      id: sync-deps
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        PDFIUM_REF: ${{ inputs.pdfium_ref }}
        REF_OVERRIDDEN: ${{ steps.pdfium.outputs.ref_overridden }}
        PDFIUM_SOURCE_DIR: ${{ github.workspace }}/pdfium
      run: |
        set -euo pipefail
        export PDFIUM_SOURCE_DIR

        deps_ready=false
        if [ "$PLATFORM" = "ios" ] && [ -f pdfium/build/config/ios/rules.gni ]; then
          deps_ready=true
        elif [ "$PLATFORM" = "android" ] && [ -f pdfium/buildtools/linux64/gn ]; then
          deps_ready=true
        fi

        if [ "$REF_OVERRIDDEN" = "true" ] || [ -n "$PDFIUM_REF" ]; then
          deps_ready=false
        fi

        if [ "$deps_ready" = "true" ]; then
          echo "DEPS cache hit — skipping gclient sync"
          echo "synced=false" >> "$GITHUB_OUTPUT"
        else
          echo "Syncing PDFium DEPS..."
          python3 make.py "build-pdfium-$PLATFORM"
          echo "synced=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Android build dependencies
      if: inputs.platform == 'android'
      shell: bash
      run: |
        set -euo pipefail
        cd pdfium
        echo n | ./build/install-build-deps.sh --android

    - name: Patch
      shell: bash
      env:
        PDFIUM_SOURCE_DIR: ${{ github.workspace }}/pdfium
      run: |
        set -euo pipefail
        export PDFIUM_SOURCE_DIR
        python3 make.py patch-${{ inputs.platform }}

    - name: Patch check
      shell: bash
      env:
        PDFIUM_SOURCE_DIR: ${{ github.workspace }}/pdfium
      run: |
        set -euo pipefail
        export PDFIUM_SOURCE_DIR
        python3 make.py patch-${{ inputs.platform }}

    - name: Build
      shell: bash
      env:
        PDFIUM_SOURCE_DIR: ${{ github.workspace }}/pdfium
      run: |
        set -euo pipefail
        export PDFIUM_SOURCE_DIR
        python3 make.py build-${{ inputs.platform }}

    - name: Install
      shell: bash
      env:
        PDFIUM_SOURCE_DIR: ${{ github.workspace }}/pdfium
      run: |
        set -euo pipefail
        export PDFIUM_SOURCE_DIR
        python3 make.py install-${{ inputs.platform }}

    - name: Test
      shell: bash
      env:
        PDFIUM_SOURCE_DIR: ${{ github.workspace }}/pdfium
      run: |
        set -euo pipefail
        export PDFIUM_SOURCE_DIR
        python3 make.py test-${{ inputs.platform }}

    - name: Archive
      shell: bash
      env:
        PDFIUM_SOURCE_DIR: ${{ github.workspace }}/pdfium
      run: |
        set -euo pipefail
        export PDFIUM_SOURCE_DIR
        python3 make.py archive-${{ inputs.platform }}
