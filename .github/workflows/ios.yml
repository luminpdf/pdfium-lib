name: iOS

permissions:
  contents: read

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'extras/images/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'extras/images/**'
  workflow_dispatch:
    inputs:
      pdfium_ref:
        description: pdfium branch, tag, or SHA (luminpdf/pdfium)
        required: false
        default: luminpdf-mobile/main
        type: string

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS
    runs-on: macos-15
    steps:
      - name: Build PDFium for iOS
        uses: ./.github/actions/pdfium-build
        with:
          platform: ios
          pdfium_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.pdfium_ref || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-ios
          path: ios.tgz
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
