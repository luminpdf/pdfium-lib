name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (without leading v). Empty uses 1.0.0 and overwrites v1.0.0
        required: false
        default: "1.0.0"
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish mobile prebuilts
    runs-on: ubuntu-latest
    steps:
      - name: Wait for both platform builds
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ios_status=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow=ios.yml \
            --commit="$SHA" \
            --limit=1 \
            --json conclusion \
            -q '.[0].conclusion // "none"')

          android_status=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow=android.yml \
            --commit="$SHA" \
            --limit=1 \
            --json conclusion \
            -q '.[0].conclusion // "none"')

          echo "iOS: $ios_status, Android: $android_status"

          if [ "$ios_status" != "success" ] || [ "$android_status" != "success" ]; then
            echo "::error::Both iOS and Android workflows must succeed for commit ${SHA} before publishing."
            echo "Run the iOS and Android workflows manually first, then re-run Release."
            exit 1
          fi

          ios_run=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow=ios.yml \
            --commit="$SHA" \
            --status=success \
            --limit=1 \
            --json databaseId \
            -q '.[0].databaseId')

          android_run=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow=android.yml \
            --commit="$SHA" \
            --status=success \
            --limit=1 \
            --json databaseId \
            -q '.[0].databaseId')

          echo "ios_run=$ios_run" >> "$GITHUB_OUTPUT"
          echo "android_run=$android_run" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ inputs.version }}"
          ver="${ver#v}"
          if [ -z "$ver" ]; then
            ver="1.0.0"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Publishing v${ver}"

      - name: Download iOS artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.gate.outputs.ios_run }}" \
            --repo "$GITHUB_REPOSITORY" \
            -n artifact-ios

      - name: Download Android artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.gate.outputs.android_run }}" \
            --repo "$GITHUB_REPOSITORY" \
            -n artifact-android \
            -D android-artifact
          mv android-artifact/android.tgz ./android.tgz

      - name: Publish release
        uses: ./.github/actions/pdfium-publish
        with:
          version: ${{ steps.version.outputs.version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
