name: Android

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      pdfium_ref:
        description: pdfium branch, tag, or SHA (luminpdf/pdfium)
        required: false
        default: luminpdf-mobile/main
        type: string

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - name: Build PDFium for Android
        uses: ./.github/actions/pdfium-build
        with:
          platform: android
          pdfium_ref: ${{ inputs.pdfium_ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-android
          path: android.tgz
          retention-days: 30
